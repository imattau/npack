[package]
name = "npack-gui"
version = "0.9.3"
edition.workspace = true
description = "Reference GUI exercising npackd's JSON-RPC service API"
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
eframe = "0.36.2"
egui = "0.36.2"
anyhow = "1.0.104"
base64 = "0.22"
egui_extras = { version = "0.36.2", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3.27.0"
