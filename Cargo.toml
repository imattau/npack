[package]
name = "npack"
version = "0.1.0"
edition = "2024"
description = "A Nostr-native package manager"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
nostr = { version = "0.45.3", features = ["os-rng"] }

[dev-dependencies]
tempfile = "3"
