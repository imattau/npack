[package]
name = "npack"
version = "0.1.0"
edition = "2024"
description = "A Nostr-native package manager"
license = "MIT"

[dependencies]
anyhow = "1"
bitcoin_hashes = "1.2"
clap = { version = "4", features = ["derive"] }
dirs = "6"
goblin = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
nostr = { version = "0.45.3", features = ["os-rng"] }
nostr-blossom = "0.45.0"
nostr-sdk = "0.45.2"
semver = "1"
tar = "0.4"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
