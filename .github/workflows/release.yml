name: Release package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Builds both the command line tool and the desktop app.
      - name: Build npack and npack-gui
        run: cargo build --release --locked

      - name: Determine release version
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The version a package is labelled with comes from the tag, but the
      # version the program reports (`npack --version`) comes from Cargo.toml.
      # Refuse to publish a release where the two disagree.
      - name: Check the tag matches the built version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          built=$(target/release/npack --version | awk '{print $2}')
          gui=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "npack-gui") | .version')
          test "$built" = "$VERSION" || {
            echo "Tag v$VERSION does not match npack $built in Cargo.toml" >&2
            exit 1
          }
          test "$gui" = "$VERSION" || {
            echo "Tag v$VERSION does not match npack-gui $gui in Cargo.toml" >&2
            exit 1
          }

      - name: Build npk packages and manifests
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISHER: ${{ vars.NOSTR_PUBLISHER }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            PUBLISHER="manual-test-publisher"
          fi
          mkdir -p package-output
          packaging/build-npk.sh "$VERSION" "$PUBLISHER" target/release package-output

      # npack (CLI and service, no graphics libraries), npack-gui (the desktop
      # app) and npack-desktop (installs both). See packaging/build-linux-packages.sh.
      - name: Build Debian and RPM packages
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm
          packaging/build-linux-packages.sh "$VERSION" target/release package-output

      - name: Stage the dependency lockfile for the SBOM
        run: |
          mkdir sbom-root
          cp Cargo.lock sbom-root/

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: sbom-root
          format: spdx-json
          output-file: package-output/npack.spdx.json

      - name: Verify package output
        run: |
          (cd package-output && sha256sum --check SHA256SUMS)
          for manifest in package-output/*.manifest.json; do
            cargo run --quiet -- verify "$manifest"
          done

      - name: Attest package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: package-output/*.npk

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: npack-release-bundle
          path: package-output
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            package-output/*.npk
            package-output/*.deb
            package-output/*.rpm
            package-output/*.manifest.json
            package-output/SHA256SUMS
            package-output/npack.spdx.json

  nostr-handoff:
    name: Publish to Nostr
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: npack-release-bundle
          path: package-output

      # Publishes every package manifest in the bundle: npack first, then the
      # desktop app, which depends on it.
      - name: Publish artifacts and events
        env:
          NOSTR_SECRET_KEY: ${{ secrets.NOSTR_SECRET_KEY }}
          NOSTR_RELAYS: ${{ vars.NOSTR_RELAYS }}
          NOSTR_BLOSSOM_SERVERS: ${{ vars.NOSTR_BLOSSOM_SERVERS }}
        run: |
          test -n "$NOSTR_SECRET_KEY" || {
            echo "The release environment must define NOSTR_SECRET_KEY" >&2
            exit 1
          }
          test -n "$NOSTR_RELAYS" || {
            echo "The repository must define NOSTR_RELAYS" >&2
            exit 1
          }
          test -n "$NOSTR_BLOSSOM_SERVERS" || {
            echo "The repository must define NOSTR_BLOSSOM_SERVERS" >&2
            exit 1
          }
          relay_args=()
          while IFS= read -r relay; do
            [[ -z "${relay//[[:space:]]/}" ]] && continue
            relay_args+=(--relay "$relay")
          done <<< "$NOSTR_RELAYS"
          server_args=()
          while IFS= read -r server; do
            [[ -z "${server//[[:space:]]/}" ]] && continue
            server_args+=(--server "$server")
          done <<< "$NOSTR_BLOSSOM_SERVERS"
          test "${#relay_args[@]}" -gt 0
          test "${#server_args[@]}" -gt 0
          manifests=$(find package-output -maxdepth 1 -name '*.manifest.json' | sort)
          test -n "$manifests"
          # npack must be published before npack-gui, which depends on it.
          ordered=$(printf '%s\n' "$manifests" | grep -v 'npack-gui' ; printf '%s\n' "$manifests" | grep 'npack-gui' || true)
          while IFS= read -r manifest; do
            [[ -z "$manifest" ]] && continue
            echo "Publishing $manifest"
            cargo run --quiet -- publish "$manifest" \
              --secret-key "$NOSTR_SECRET_KEY" \
              "${relay_args[@]}" \
              "${server_args[@]}"
          done <<< "$ordered"

      - name: Confirm publication boundary
        run: |
          echo "The signed artifacts and release events were submitted to the configured Nostr relays."
