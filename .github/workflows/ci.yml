name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Install PolicyKit tooling
        run: sudo apt-get update && sudo apt-get install -y policykit-1
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features
      - name: Install AppStream tooling
        run: sudo apt-get update && sudo apt-get install -y appstream
      - name: Validate generated AppStream metadata
        run: |
          mkdir -p /tmp/appstream-ci/source/.npack
          cat > /tmp/appstream-ci/source/.npack/manifest.json <<'EOF'
          {
            "publisher": "483440dfc4efeb8776ca27413c929653ea60484ca2d0e6b97678a0622c6bf413",
            "name": "npack",
            "version": "0.0.0",
            "artifact": "ci.npk",
            "sha256": "",
            "app": {
              "summary": "A Nostr-native package manager",
              "description": "npack discovers, verifies, and installs signed release artifacts published on Nostr and stored on Blossom.",
              "homepage": "https://github.com/imattau/npack",
              "license": "MIT",
              "categories": ["System"],
              "release_date": "2026-01-01"
            }
          }
          EOF
          cargo run --quiet -- pack /tmp/appstream-ci/source --output /tmp/appstream-ci/ci.npk
          cargo run --quiet -- appstream /tmp/appstream-ci/ci.npk --output /tmp/appstream-ci/ci.metainfo.xml
          appstreamcli validate --no-net /tmp/appstream-ci/ci.metainfo.xml
      - name: Install packaging tooling
        run: sudo apt-get install -y dpkg-dev rpm desktop-file-utils
      - name: Validate the desktop app's launcher and AppStream files
        run: |
          desktop-file-validate packaging/desktop/io.npack.Gui.desktop
          sed 's/@VERSION@/0.0.0/;s/@DATE@/2026-01-01/' packaging/desktop/io.npack.Gui.metainfo.xml > /tmp/gui.metainfo.xml
          appstreamcli validate --no-net /tmp/gui.metainfo.xml
      # Catches a broken packaging script on the pull request, not on release day.
      - name: Packaging smoke test
        run: |
          cargo build --locked
          packaging/build-npk.sh 0.0.0 manual-test-publisher target/debug /tmp/npk-ci
          for manifest in /tmp/npk-ci/*.manifest.json; do
            cargo run --quiet -- verify "$manifest"
          done
          packaging/build-linux-packages.sh 0.0.0 target/debug /tmp/pkgs-ci
