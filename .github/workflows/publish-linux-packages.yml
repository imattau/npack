name: Publish Linux packages

# Builds the .deb and .rpm packages for an existing GitHub release and uploads
# them to it: npack, npack-gui and npack-desktop (see
# packaging/build-linux-packages.sh). The release workflow already does this for
# new releases; use this to add or replace packages on one that exists.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing GitHub release version, without the v prefix (0.11.0 or later, which is when the desktop app became an Electron app)
        required: true
        default: "0.5.0"
        type: string

permissions:
  contents: write

jobs:
  packages:
    name: Build and upload .deb and .rpm
    runs-on: ubuntu-24.04
    steps:
      - name: Validate version and release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must be a stable semantic version such as 0.5.0" >&2
            exit 1
          }
          gh release view "v${VERSION}" --repo "$REPOSITORY" >/dev/null

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Check this release has the Electron desktop app and packaging scripts
        run: |
          test -f npack-electron/package.json -a -x packaging/build-linux-packages.sh || {
            echo "This release predates the Electron desktop app; use 0.11.0 or later." >&2
            exit 1
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build npack
        run: cargo build -p npack --release --locked

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npack-electron/package-lock.json

      # The desktop app is an Electron window around the web store that the npack
      # daemon serves, so it needs no Rust build of its own.
      - name: Build the desktop app
        working-directory: npack-electron
        run: |
          npm ci
          npm run dist

      - name: Build Debian and RPM packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm
          packaging/build-linux-packages.sh "$VERSION" target/release package-output npack-electron/release/linux-unpacked

      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: gh release upload "v${VERSION}" package-output/*.deb package-output/*.rpm --repo "$REPOSITORY" --clobber
