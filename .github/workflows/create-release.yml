name: Create release

# Tags a release from master and starts the "Release package" workflow for it,
# so a release needs no local `git push`. Bump the version in both Cargo.toml
# files (and Cargo.lock) and merge that first; this refuses to tag anything else.
#
# A tag pushed with the workflow's own token does not start other workflows, so
# this dispatches release.yml on the new tag explicitly. To rehearse a release
# without tagging, run "Release package" by hand on master instead: it builds
# everything and skips the GitHub Release and Nostr steps.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v prefix (must match both Cargo.toml files)
        required: true
        type: string
      summary:
        description: One line for the tag message, e.g. "desktop app packages, doctor, rollback"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Tag and start the release
    runs-on: ubuntu-latest
    steps:
      - name: Release only from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
            echo "Run this workflow on $DEFAULT_BRANCH, not $GITHUB_REF" >&2
            exit 1
          }

      - name: Check out source
        uses: actions/checkout@v4

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: packaging/check-release-version.sh "$VERSION"

      - name: Refuse an existing tag or release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "Tag v${VERSION} already exists" >&2
            exit 1
          fi
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "A release for v${VERSION} already exists" >&2
            exit 1
          fi

      - name: Create and push the tag
        env:
          VERSION: ${{ inputs.version }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "npack ${VERSION}: ${SUMMARY}"
          git push origin "refs/tags/v${VERSION}"

      - name: Start the release workflow on the tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref "v${VERSION}"
          echo "Started Release package for v${VERSION}; watch it under the Actions tab." >> "$GITHUB_STEP_SUMMARY"
